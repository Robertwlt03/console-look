[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "console-look"
version = "0.1.0"
description = "One shared look for terminal output in Python and Swift: headings, check marks, hints, frames and prompts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robert Walter" }]
requires-python = ">=3.13"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Robertwlt03/console-look"

[project.scripts]
console-look = "console_look:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["console_look"]
